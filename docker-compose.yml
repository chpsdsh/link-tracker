version: "3.9"

services:
  postgres:
    image: postgres:18
    container_name: postgres_db

    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb

    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata: