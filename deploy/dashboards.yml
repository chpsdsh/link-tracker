apiVersion: 1
providers:
  - name: 'My Dashboards'      # Уникальное имя провайдера
    orgId: 1                  # ID организации (по умолчанию 1)
    folder: 'General'         # Название папки в интерфейсе Grafana
    type: 'file'
    disableDeletion: false    # Разрешить удаление дашборда из UI
    updateIntervalSeconds: 10 # Частота проверки обновлений (в секундах)
    options:
      path: '/var/lib/grafana/dashboards'